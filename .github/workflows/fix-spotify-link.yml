name: Fix DiggerMan Spotify Artist Link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-spotify-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace stale Spotify artist URL without changing site templates
        shell: bash
        run: |
          OLD='https://open.spotify.com/artist/7fSMDP0eWrFwYol9Vye2Ty'
          NEW='https://open.spotify.com/artist/7fSMDPOeWrFwYol9Vye2Ty'
          for file in index.html blog/diggerman-artist-spotlight/index.html; do
            if [ -f "$file" ]; then
              python - "$file" "$OLD" "$NEW" <<'PY'
import sys
from pathlib import Path
path = Path(sys.argv[1])
old = sys.argv[2]
new = sys.argv[3]
text = path.read_text(encoding='utf-8')
updated = text.replace(old, new)
if updated != text:
    path.write_text(updated, encoding='utf-8')
PY
            fi
          done

      - name: Commit only if the stale URL was found
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No stale Spotify URL found; no changes made.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html blog/diggerman-artist-spotlight/index.html
          git commit -m 'Fix DiggerMan Spotify artist link'
          git push
